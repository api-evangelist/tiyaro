aid: tiyaro
name: Tiyaro
description: >-
  Tiyaro is an enterprise AI company whose product, DeepQuery, replicates
  complete business processes as AI agents that can be described in plain
  English. Rather than rules engines or brittle integration workflows, DeepQuery
  uses LLMs combined with enterprise-specific product and customer data to
  identify a solution strategy and execute it across multiple steps using
  built-in tools. Its flagship application targets customer support and IT
  service desks - an "IT SuperAgent" trained on hundreds of third-party product
  procedures that recommends and executes resolution steps for incoming tickets
  - alongside revenue-operations and sales/marketing automation use cases. The
  company was founded by a team that previously built an edge software stack for
  hosting AI applications, and is backed by General Catalyst. Tiyaro goes to
  market as an enterprise product engaged through a book-a-demo motion rather
  than a self-serve developer API.
